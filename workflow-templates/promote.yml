name: Promote

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  promote:
    uses: brokspace/.github/.github/workflows/promote.yml@main
    # true when the repository releases from v* tags (it has a release.yml).
    with:
      release: false
    secrets: inherit
