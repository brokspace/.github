# This repository's own PR policy. Other repositories call
# brokspace/.github/.github/workflows/pr-policy.yml@main (workflow-templates/).
name: PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  policy:
    uses: ./.github/workflows/pr-policy.yml
